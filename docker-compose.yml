services:

  postgres:
    image: postgres:16
    container_name: job-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  scheduler:
    build: .
    container_name: job-scheduler
    depends_on:
      - postgres
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/jobsdb"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data: